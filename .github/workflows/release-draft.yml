name: Draft a release for a version tag

# A tag triggers nothing else in this project — no build, no deploy. This
# workflow only makes sure a tagged version gets a release page: it opens a
# DRAFT with generated notes, which a human then edits into something worth
# reading and publishes. Nothing is published automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generated notes need the history behind the tag

      - name: Open a draft release, unless one already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release — leaving it alone."
            exit 0
          fi
          gh release create "$TAG" --draft --generate-notes --title "$TAG"
          echo "Draft created for $TAG. Edit the notes and publish when ready."
